<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1b5e20">
  <title>Curral Ágil</title>

  <link rel="stylesheet" href="css/app.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>

<body>

<header>
  <div>
    <h1>Curral Ágil</h1>
    <p>Caderno digital da propriedade</p>
  </div>

  <span id="statusRede">Verificando...</span>
</header>

<main>

  <section class="painel">

    <h2>Hoje</h2>

    <div class="cards">
      <div class="card">
        <strong id="totalAnimais">0</strong>
        <span>Animais</span>
      </div>

      <div class="card">
        <strong id="totalLactacao">0</strong>
        <span>Em lactação</span>
      </div>
    </div>

  </section>

  <section>

    <h2>Novo animal</h2>

    <form id="formAnimal">

      <label>
        Número do brinco
        <input
          id="brinco"
          type="text"
          required
          placeholder="Ex.: 001">
      </label>

      <label>
        Nome
        <input
          id="nome"
          type="text"
          placeholder="Ex.: Mimosa">
      </label>

      <label>
        Categoria
        <select id="categoria">
          <option value="lactacao">Vaca em lactação</option>
          <option value="seca">Vaca seca</option>
          <option value="novilha">Novilha</option>
          <option value="bezerra">Bezerra</option>
        </select>
      </label>

      <button type="submit">
        Cadastrar animal
      </button>

    </form>

  </section>

  <section>

    <div class="titulo-linha">
      <h2>Rebanho</h2>
      <span id="contadorRebanho">0</span>
    </div>

    <div id="listaAnimais"></div>

  </section>

</main>

<nav>
  <button class="ativo">Hoje</button>
  <button>Rebanho</button>
  <button>Manejo</button>
  <button>Animal</button>
</nav>

<script src="js/db.js"></script>
<script src="js/app.js"></script>

</body>
</html>
